<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Super Admin Sign In | Eusta</title>
    <link rel="icon" type="image/x-icon" href="assets/images/favicon.png">

    <!-- Google Fonts & Material Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link href="assets/css/bootstrap.min.css" rel="stylesheet">

    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }

      body.super-login-page {
        font-family: 'Plus Jakarta Sans', sans-serif !important;
        background-color: #FAF9F6 !important;
        color: #4A4A4A;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        margin: 0;
        position: relative;
      }

      /* Subtle warm ambient lighting */
      body.super-login-page::before {
        content: '';
        position: fixed;
        top: -150px;
        right: -150px;
        width: 500px;
        height: 500px;
        background: radial-gradient(circle, rgba(177, 139, 94, 0.08) 0%, rgba(250, 249, 246, 0) 70%);
        pointer-events: none;
      }

      body.super-login-page::after {
        content: '';
        position: fixed;
        bottom: -150px;
        left: -150px;
        width: 500px;
        height: 500px;
        background: radial-gradient(circle, rgba(177, 139, 94, 0.06) 0%, rgba(250, 249, 246, 0) 70%);
        pointer-events: none;
      }

      .login-container {
        width: 100%;
        max-width: 440px;
        position: relative;
        z-index: 1;
      }

      /* Super Admin Card */
      .super-login-card {
        background: #ffffff;
        border: 1px solid rgba(177, 139, 94, 0.18);
        border-radius: 20px;
        padding: 40px 36px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.04), 0 4px 12px rgba(177, 139, 94, 0.06);
        transition: all 0.3s ease;
      }

      .super-login-card:hover {
        border-color: rgba(177, 139, 94, 0.3);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06), 0 6px 16px rgba(177, 139, 94, 0.1);
      }

      /* Top Badge & Logo */
      .super-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: #F7F3EE;
        border: 1px solid rgba(177, 139, 94, 0.25);
        border-radius: 50px;
        padding: 5px 14px;
        margin-bottom: 20px;
      }
      .super-badge span.icon {
        color: #B18B5E;
        font-size: 16px;
      }
      .super-badge span.text {
        color: #99754C;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.8px;
        text-transform: uppercase;
      }

      .brand-logo-wrap {
        margin-bottom: 20px;
      }
      .brand-logo-wrap img {
        height: 38px;
        width: auto;
      }

      .login-title {
        font-size: 24px;
        font-weight: 800;
        color: #1A1A1A;
        letter-spacing: -0.4px;
        margin-bottom: 6px;
      }

      .login-subtitle {
        font-size: 13.5px;
        color: #6B7280;
        line-height: 1.5;
        margin-bottom: 28px;
      }

      /* Form Fields */
      .form-group {
        margin-bottom: 20px;
      }

      .form-label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #374151;
        margin-bottom: 7px;
      }

      .input-icon-wrap {
        position: relative;
        display: flex;
        align-items: center;
      }

      .input-icon-wrap .field-icon {
        position: absolute;
        left: 14px;
        color: #9CA3AF;
        font-size: 20px;
        pointer-events: none;
        transition: color 0.2s ease;
      }

      .input-icon-wrap .form-control {
        width: 100%;
        background-color: #ffffff;
        border: 1px solid #D1D5DB;
        border-radius: 10px;
        padding: 12px 14px 12px 42px;
        font-size: 14px;
        color: #111827;
        font-family: inherit;
        outline: none;
        transition: all 0.2s ease;
      }

      .input-icon-wrap .form-control::placeholder {
        color: #9CA3AF;
      }

      .input-icon-wrap .form-control:focus {
        border-color: #B18B5E;
        box-shadow: 0 0 0 3px rgba(177, 139, 94, 0.15);
      }

      .input-icon-wrap .form-control:focus + .field-icon {
        color: #B18B5E;
      }

      .pwd-toggle-btn {
        position: absolute;
        right: 12px;
        background: transparent;
        border: none;
        color: #9CA3AF;
        cursor: pointer;
        padding: 4px;
        display: flex;
        align-items: center;
        font-size: 20px;
        transition: color 0.2s ease;
      }

      .pwd-toggle-btn:hover {
        color: #B18B5E;
      }

      /* Options row */
      .form-options-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 24px;
        font-size: 13px;
      }

      .remember-check {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #4B5563;
        cursor: pointer;
        user-select: none;
      }

      .remember-check input[type="checkbox"] {
        accent-color: #B18B5E;
        width: 16px;
        height: 16px;
        cursor: pointer;
      }

      .forgot-pass-link {
        color: #B18B5E;
        text-decoration: none;
        font-weight: 600;
        transition: color 0.2s ease;
      }

      .forgot-pass-link:hover {
        color: #99754C;
        text-decoration: underline;
      }

      /* Submit button */
      .btn-super-submit {
        width: 100%;
        background-color: #B18B5E;
        color: #ffffff;
        border: none;
        border-radius: 10px;
        height: 48px;
        font-size: 15px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        box-shadow: 0 4px 14px rgba(177, 139, 94, 0.25);
        transition: all 0.25s ease;
      }

      .btn-super-submit:hover {
        background-color: #99754C;
        box-shadow: 0 6px 18px rgba(177, 139, 94, 0.35);
        transform: translateY(-1px);
      }

      .btn-super-submit:active {
        transform: translateY(0);
      }

      /* Footer links */
      .login-footer {
        margin-top: 24px;
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: center;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: #9CA3AF;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        background-color: #10B981;
        border-radius: 50%;
        box-shadow: 0 0 6px #10B981;
      }
    </style>
  </head>
  <body class="super-login-page">

    <div class="login-container">
      <div class="super-login-card">

        <!-- Badge & Logo -->
        <div class="d-flex justify-content-between align-items-center mb-2">
          <div class="brand-logo-wrap mb-0">
            <img src="assets/images/logo.png" alt="Eusta Logo" onerror="this.src='../admin/assets/img/logo.png'">
          </div>
          <div class="super-badge mb-0">
            <span class="material-symbols-outlined icon">shield</span>
            <span class="text">Super Admin</span>
          </div>
        </div>

        <h1 class="login-title mt-3">Welcome Back</h1>
        <p class="login-subtitle">Sign in to access the Eusta master administration system and platform controls.</p>

        <!-- Form -->
        <form id="superLoginForm">
          <div class="form-group">
            <label class="form-label" for="inputEmailAddress">Email Address</label>
            <div class="input-icon-wrap">
              <span class="material-symbols-outlined field-icon">mail</span>
              <input type="email" id="inputEmailAddress" class="form-control" placeholder="Enter your email (optional)">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="inputChoosePassword">Password</label>
            <div class="input-icon-wrap">
              <span class="material-symbols-outlined field-icon">lock</span>
              <input type="password" id="inputChoosePassword" class="form-control" placeholder="Enter your password (optional)">
              <button type="button" class="pwd-toggle-btn" id="togglePwdBtn" title="Toggle Password Visibility">
                <span class="material-symbols-outlined" id="pwdIcon">visibility</span>
              </button>
            </div>
          </div>

          <div class="form-options-row">
            <label class="remember-check">
              <input type="checkbox">
              <span>Remember Me</span>
            </label>
            <a href="auth-forgot-password.html" class="forgot-pass-link">Forgot Password?</a>
          </div>

          <button type="submit" class="btn-super-submit" id="loginSubmitBtn">
            <span>Sign In to Super Admin</span>
            <span class="material-symbols-outlined" style="font-size: 18px;">arrow_forward</span>
          </button>
        </form>

        <!-- Footer Links -->
        <div class="login-footer">
          <div class="status-pill">
            <span class="status-dot"></span>
            <span>All System Services Operational</span>
          </div>
        </div>

      </div>
    </div>

    <!-- Scripts -->
    <script src="assets/js/jquery.min.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // Toggle password visibility
        const pwdInput = document.getElementById('inputChoosePassword');
        const toggleBtn = document.getElementById('togglePwdBtn');
        const pwdIcon = document.getElementById('pwdIcon');

        if (toggleBtn && pwdInput) {
          toggleBtn.addEventListener('click', function() {
            if (pwdInput.type === 'password') {
              pwdInput.type = 'text';
              pwdIcon.textContent = 'visibility_off';
            } else {
              pwdInput.type = 'password';
              pwdIcon.textContent = 'visibility';
            }
          });
        }

        // Form Submission
        const loginForm = document.getElementById('superLoginForm');
        if (loginForm) {
          loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('inputEmailAddress').value.trim() || 'admin@eusta.com';
            const password = document.getElementById('inputChoosePassword').value.trim() || 'demo';
            const submitBtn = document.getElementById('loginSubmitBtn');

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>Authenticating...</span>';

            try {
              const res = await fetch('/api/auth/signin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
              });

              if (res.ok) {
                const data = await res.json();
                if (data.success && data.user && data.user.role === 'superadmin') {
                  localStorage.setItem('superToken', data.token);
                  localStorage.setItem('superUser', JSON.stringify(data.user));
                  window.location.href = 'index.html';
                  return;
                }
              }
            } catch(err) {
              console.warn("Backend auth unavailable, falling back to demo session for testing:", err);
            }

            // Direct fallback sign in for testing phase / static hosting
            localStorage.setItem('superToken', 'demo-super-token');
            localStorage.setItem('superUser', JSON.stringify({
              id: 1,
              name: 'Super Admin',
              email: email,
              role: 'superadmin'
            }));
            window.location.href = 'index.html';
          });
        }
      });
    </script>
  </body>
</html>
