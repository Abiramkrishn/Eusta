<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Eusta | Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0f0f0f;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    /* Background gradient orbs */
    body::before {
      content: '';
      position: fixed;
      top: -20%;
      left: -10%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(177,139,94,0.15) 0%, transparent 70%);
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -20%;
      right: -10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(177,139,94,0.1) 0%, transparent 70%);
      pointer-events: none;
    }

    .container {
      max-width: 900px;
      width: 100%;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(177,139,94,0.12);
      border: 1px solid rgba(177,139,94,0.3);
      border-radius: 50px;
      padding: 8px 20px;
      margin-bottom: 2rem;
    }
    .logo-badge span {
      color: #B18B5E;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    h1 {
      font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 700;
      letter-spacing: -1px;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #ffffff 0%, #B18B5E 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 1.1rem;
      color: rgba(255,255,255,0.5);
      font-weight: 400;
      margin-bottom: 3.5rem;
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.7;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 2rem 1.5rem;
      text-decoration: none;
      color: inherit;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      text-align: left;
    }
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(177,139,94,0.08) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.3s ease;
      border-radius: 20px;
    }
    .card:hover {
      border-color: rgba(177,139,94,0.4);
      transform: translateY(-4px);
      box-shadow: 0 20px 60px rgba(177,139,94,0.12);
    }
    .card:hover::before { opacity: 1; }

    .card-icon {
      width: 52px;
      height: 52px;
      background: rgba(177,139,94,0.12);
      border: 1px solid rgba(177,139,94,0.25);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #B18B5E;
      margin-bottom: 1.25rem;
      transition: all 0.3s ease;
    }
    .card-icon .material-symbols-outlined {
      font-size: 26px;
      color: #B18B5E;
    }
    .card:hover .card-icon {
      background: rgba(177,139,94,0.22);
    }

    .card-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #B18B5E;
      margin-bottom: 0.4rem;
    }

    .card h3 {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 0;
      color: #ffffff;
    }

    .card-arrow {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      width: 32px;
      height: 32px;
      background: rgba(255,255,255,0.06);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      color: rgba(255,255,255,0.4);
    }
    .card-arrow .material-symbols-outlined {
      font-size: 18px;
    }
    .card:hover .card-arrow {
      background: rgba(177,139,94,0.2);
      color: #B18B5E;
      transform: translate(2px, -2px);
    }

    .footer {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: rgba(255,255,255,0.45);
      font-size: 12.5px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      padding: 6px 16px;
      border-radius: 20px;
      letter-spacing: 0.3px;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      background: #10B981;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-badge">
      <span>Eusta Platform</span>
    </div>

    <h1>Welcome to Eusta</h1>
    <p class="subtitle">A complete multi-panel platform. Choose your section below to get started.</p>

    <div class="cards">
      <a href="user/index.html" class="card">
        <div class="card-icon"><span class="material-symbols-outlined">storefront</span></div>
        <div class="card-label">Storefront</div>
        <h3>User Side</h3>
        <div class="card-arrow"><span class="material-symbols-outlined">north_east</span></div>
      </a>

      <a href="admin/index.html" class="card">
        <div class="card-icon"><span class="material-symbols-outlined">settings</span></div>
        <div class="card-label">Management</div>
        <h3>Admin Panel</h3>
        <div class="card-arrow"><span class="material-symbols-outlined">north_east</span></div>
      </a>

      <a href="super-admin/index.html" class="card">
        <div class="card-icon"><span class="material-symbols-outlined">security</span></div>
        <div class="card-label">Control</div>
        <h3>Super Admin</h3>
        <div class="card-arrow"><span class="material-symbols-outlined">north_east</span></div>
      </a>
    </div>

    <div class="footer">
      <span class="status-dot"></span>
      <span>Development Mode</span>
    </div>
  </div>
</body>
</html>
